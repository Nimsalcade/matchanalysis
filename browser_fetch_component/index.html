<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>WhoScored browser fetch</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; color: inherit; }
  button { cursor: pointer; border: 1px solid #6b7280; border-radius: 6px; padding: 8px 12px;
           color: inherit; background: transparent; font: inherit; }
  button:disabled { cursor: default; opacity: .65; }
  #status { margin-left: 8px; }
</style>
<button id="fetch" type="button" disabled>Fetch WhoScored in this browser</button>
<span id="status" role="status"></span>
<script>
  const button = document.getElementById("fetch");
  const status = document.getElementById("status");
  const parentOrigin = window.location.origin;
  let args;
  let pending;
  let timeout;

  function streamlit(type, fields = {}) {
    window.parent.postMessage({isStreamlitMessage: true, type, ...fields}, parentOrigin);
  }

  function finish(html, error) {
    clearTimeout(timeout);
    const value = {...pending, html, error};
    pending = null;
    button.disabled = false;
    status.textContent = error ? "" : "Events received";
    streamlit("streamlit:setComponentValue", {value, dataType: "json"});
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent || event.origin !== parentOrigin) return;
    const message = event.data;
    if (message?.type === "streamlit:render") {
      const {url, request_id} = message.args;
      if (args?.url !== url || args?.request_id !== request_id) {
        clearTimeout(timeout);
        pending = null;
        status.textContent = "";
      }
      args = {url, request_id};
      button.disabled = message.disabled || Boolean(pending) || !url || !request_id;
      if (message.theme) document.body.style.color = message.theme.textColor;
      return;
    }

    if (!pending || message?.url !== pending.url || message.request_id !== pending.request_id) return;
    if (message.type === "matchanalysis:who-ack") {
      clearTimeout(timeout);
      status.textContent = "Reading the match page…";
      timeout = setTimeout(() => finish(null, "The browser extension did not return match data in time."), 28000);
    } else if (message.type === "matchanalysis:who-result") {
      finish(message.html, message.error);
    }
  });

  button.addEventListener("click", (event) => {
    if (!event.isTrusted || !args || pending) return;
    pending = {...args};
    button.disabled = true;
    status.textContent = "Connecting to the browser extension…";
    timeout = setTimeout(() => finish(null, "Install the MatchAnalysis Browser Fetch extension and reload this app."), 2000);
    window.parent.postMessage({type: "matchanalysis:who-request", ...pending}, parentOrigin);
  });

  streamlit("streamlit:componentReady", {apiVersion: 1});
  streamlit("streamlit:setFrameHeight", {height: 44});
</script>
</html>
